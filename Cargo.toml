[workspace]
resolver = "3"
members = ["crates/syntax", "crates/ir", "crates/geom", "crates/brush", "crates/render", "crates/eval", "crates/cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
skia-safe = "0.153"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ramose-syntax = { path = "crates/syntax" }
ramose-ir = { path = "crates/ir" }
ramose-geom = { path = "crates/geom" }
ramose-brush = { path = "crates/brush", default-features = false }
ramose-render = { path = "crates/render" }
ramose-eval = { path = "crates/eval" }

[profile.dev.package."*"]
opt-level = 2
