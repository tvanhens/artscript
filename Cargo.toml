[workspace]
resolver = "3"
members = ["crates/syntax", "crates/ir", "crates/brush", "crates/render", "crates/eval", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
skia-safe = "0.153"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
artscript-syntax = { path = "crates/syntax" }
artscript-ir = { path = "crates/ir" }
artscript-brush = { path = "crates/brush" }
artscript-render = { path = "crates/render" }
artscript-eval = { path = "crates/eval" }

[profile.dev.package."*"]
opt-level = 2
