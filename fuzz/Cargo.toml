[package]
name = "artscript-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
artscript-syntax = { path = "../crates/syntax" }
artscript-ir = { path = "../crates/ir" }
artscript-eval = { path = "../crates/eval" }
artscript-render = { path = "../crates/render" }

# Kept out of the main workspace: it builds only on nightly with cargo-fuzz.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eval"
path = "fuzz_targets/eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt_eval"
path = "fuzz_targets/fmt_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gen"
path = "fuzz_targets/gen.rs"
test = false
doc = false
bench = false
