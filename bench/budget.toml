# Token budgets in o200k_base, enforced by scripts/card_budget.py.

# A ratchet, not a target: the card's size when the budget was set (3539, after `finish` in #8,
# statement heads in #3 and half-open ranges in #12 landed), rounded up to the next 50. Lower it
# whenever the card shrinks. bench/CARD_EXPERIMENT.md decides the core card's real size.
[card]
path = "docs/language.md"
tokens = 3550

# Each per-topic help page, once they exist.
[help]
glob = "docs/help/*.md"
tokens = 300
