name: Benchmark tests
on:
  pull_request:
    paths:
      - 'bench/**'
      - '.github/workflows/benchmark-tests.yml'
  push:
    branches: [main]
    paths:
      - 'bench/**'
      - '.github/workflows/benchmark-tests.yml'
permissions:
  contents: read
jobs:
  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s bench -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python bench/results/hillclimb-2026-10/analyze.py --check
