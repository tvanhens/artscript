name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    # A failed Skia prebuilt download silently falls back to a from-source build.
    # This bounds it. Do not set FORCE_SKIA_BINARIES_DOWNLOAD: in a crates.io build
    # it skips the download and forces the source build.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: test
            run: cargo test --workspace --locked
          - gate: clippy
            run: cargo clippy --workspace --all-targets --locked -- -D warnings
    steps:
      - uses: actions/checkout@v4
      # skia-bindings links freetype and fontconfig.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl pkg-config libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.gate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ${{ matrix.run }}
      - if: failure() && matrix.gate == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: target/visual-diff/
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl pkg-config libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          workspaces: fuzz
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +nightly install cargo-fuzz --locked
      - run: GEN_SEEDS=16 python3 fuzz/seeds.py
      - name: Replay the fuzz seeds
        run: |
          cd fuzz
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run "$t" "corpus/$t" -- -runs=0 -timeout=0 -rss_limit_mb=4096
          done

  ci:
    needs: [gate, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.gate.result }}" = success && test "${{ needs.fuzz.result }}" = success
