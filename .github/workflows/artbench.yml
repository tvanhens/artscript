name: artbench

on:
  # issue_comment runs only from the default branch. The review events run the PR branch's copy.
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: artbench-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  artbench:
    name: artbench
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@artbench') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@artbench') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@artbench') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      # A repo-owned GitHub App gives the comment its own name and avatar. Without it, it posts as github-actions.
      - name: app token
        id: app
        if: vars.CLAUDE_REVIEW_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLAUDE_REVIEW_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}

      - name: resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          case "$EVENT" in
            issue_comment) number=$ISSUE_NUMBER ;;
            *) number=$PR_NUMBER ;;
          esac
          read -r head_sha head_repo < <(gh api "repos/$REPO/pulls/$number" --jq '[.head.sha, .head.repo.full_name] | @tsv')
          if [ "$head_repo" != "$REPO" ]; then
            echo "fork PRs get no secrets, refusing to run" >&2
            exit 1
          fi
          model=$(printf '%s' "$BODY" | grep -oE 'model=[A-Za-z0-9._-]+' | head -n1 | cut -d= -f2 || true)
          {
            echo "number=$number"
            echo "head_sha=$head_sha"
            echo "model=${model:-claude-opus-5-5}"
          } >>"$GITHUB_OUTPUT"
          case "$EVENT" in
            issue_comment) gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null ;;
            pull_request_review_comment) gh api -X POST "repos/$REPO/pulls/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      # skia-bindings links freetype and fontconfig.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl pkg-config libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: artbench
          save-if: false
      - uses: astral-sh/setup-uv@v6
      - run: npm install -g @anthropic-ai/claude-code

      - name: artbench
        id: bench
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ steps.pr.outputs.model }}
        run: uv run bench/artbench.py --model "$MODEL" --out bench/out

      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: artbench-${{ steps.pr.outputs.head_sha }}
          path: bench/out
          if-no-files-found: warn

      - name: comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          body=bench/comment.md
          if [ -f bench/out/summary.md ]; then
            cp bench/out/summary.md "$body"
          else
            printf '<!-- artbench -->\n## artbench\n\n**FAILED** before a report was written.\n' >"$body"
          fi
          printf '\n[workflow run](%s)' "$RUN_URL" >>"$body"
          if [ -n "$ARTIFACT_URL" ]; then printf ' · [artifact with per-step art and report.json](%s)' "$ARTIFACT_URL" >>"$body"; fi
          printf '\n' >>"$body"
          gh pr comment "$NUMBER" --repo "$REPO" --body-file "$body"

      - name: fail on regression
        if: steps.bench.outcome == 'failure'
        run: exit 1
