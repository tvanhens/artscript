name: release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "npm/**"
      - ".github/workflows/release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # A PAT, not GITHUB_TOKEN: GitHub runs no workflows on a PR that GITHUB_TOKEN opens or pushes to.
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      # release-please bumps Cargo.toml only. Without this, the --locked builds fail on the release PR.
      - if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - if: steps.rp.outputs.prs_created == 'true'
        run: |
          cargo update --workspace
          if git diff --quiet Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock for the release"
          git push

  platforms:
    needs: release-please
    if: ${{ !cancelled() && !failure() && (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(jq -c . npm/platforms.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.key }}
    needs: [release-please, platforms]
    if: ${{ !cancelled() && needs.platforms.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    # A failed Skia prebuilt download silently falls back to a from-source build.
    # This bounds it. Do not set FORCE_SKIA_BINARIES_DOWNLOAD: in a crates.io build
    # it skips the download and forces the source build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # skia-bindings links freetype and fontconfig.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl pkg-config libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p ramose --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Stage the npm packages
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          expect=()
          if [[ -n "$VERSION" ]]; then expect=(--expect-version "$VERSION"); fi
          node npm/stage.mjs "${expect[@]}" platform ${{ matrix.key }} target/${{ matrix.target }}/release/${{ matrix.exe }} dist/npm
          node npm/stage.mjs "${expect[@]}" main dist/npm
      - run: node npm/smoke.mjs dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.key }}
          path: dist/npm/${{ matrix.key }}
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist/downloaded
          pattern: npm-*
      # Artifacts drop the executable bit, so restage each binary into its package.
      - name: Stage the npm packages
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for p in $(jq -r '.[] | "\(.key):\(.exe)"' npm/platforms.json); do
            key="${p%%:*}"; exe="${p#*:}"
            node npm/stage.mjs --expect-version "$VERSION" platform "$key" "dist/downloaded/npm-$key/bin/$exe" dist/npm
          done
          node npm/stage.mjs --expect-version "$VERSION" main dist/npm
      - run: node npm/publish.mjs dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
