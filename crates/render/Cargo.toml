[package]
name = "ramose-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skia-safe.workspace = true
ramose-ir.workspace = true
ramose-geom.workspace = true
ramose-brush.workspace = true
gif = "0.13"
color_quant = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { workspace = true, features = ["metal", "ganesh"] }
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", features = ["MTLDevice", "MTLCommandQueue", "std"] }

[dev-dependencies]
roxmltree = "0.20"
